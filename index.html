<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla Porsche</title>
    <style>
        .layout {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Tres columnas */
            gap: 8px;
            width: 100%;
            height: 100vh; /* Ocupa toda la altura del viewport */
            box-sizing: border-box; /* Asegura que el padding y el borde no desborden */
        }
    
        .layout div {
            position: relative;
            overflow: hidden;
            border: 11.5px solid grey ; /* Hace que el borde sea transparente */
            border-radius: 5px; /* Opcional: esquinas redondeadas */
            transition: transform 0.5s ease, border-color 0.3s ease; /* Animación suave */
        }
    
        .layout div img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta las imágenes al contenedor sin distorsión */
            display: block; /* Elimina espacios en blanco alrededor de la imagen */
            transition: transform 0.5s ease; /* Animación suave para la imagen */
        }
    
        /* Efecto al pasar el cursor */
        .layout div:hover {
            transform: scale(1.028); /* Aumenta ligeramente el tamaño del contenedor */
            border-color: #fc9a08; /* Cambia el color del borde */
        }
    
        .layout div:hover img {
            transform: scale(1.1); /* Aumenta ligeramente el tamaño de la imagen */
        }
    
        @media (max-width: 768px) {
            .layout {
                grid-template-columns: repeat(2, 1fr); /* Dos columnas en pantallas más pequeñas */
            }
        }
    
        @media (max-width: 480px) {
            .layout {
                grid-template-columns: 1fr; /* Una columna en pantallas muy pequeñas */
            }
        }
    </style>
</head>

<body>
    <section class="layout">
        <div><img src="1.jpg" alt="Imagen 1"></div>
        <div><img src="2.jpg" alt="Imagen 2"></div>
        <div><img src="3.jpg" alt="Imagen 3"></div>
        <div><img src="7.jpg" alt="Imagen 7"></div>
        <div><img src="8.jpg" alt="Imagen 8"></div>
        <div><img src="9.jpg" alt="Imagen 9"></div>
    </section>
</body>

</html>
