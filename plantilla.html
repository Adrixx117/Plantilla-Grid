<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla Porsche</title>
    <style>
        .layout {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Tres columnas */
            gap: 8px;
            width: 100%;
        }

        .layout div {
            position: relative;
            overflow: hidden;
            border: 10px solid transparent; /* Hace que el borde sea transparente */
            border-image: linear-gradient(45deg, #d4d4d4, #ffffff, #a6a6a6); /* Degradado metálico */
            border-image-slice: 1; /* Aplica el degradado al borde */
            border-radius: 7px; /* Opcional: esquinas redondeadas */
            transition: transform 0.5s ease, border-color 0.3s ease; /* Animación suave */
        }

        .layout div:hover {
            transform: scale(1.04); /* Aumenta ligeramente el tamaño */
            border-color: #f99e17; /* Cambia el color del borde al pasar el cursor */
            border-image: none; /* Elimina el degradado al hacer hover */
        }

        .layout div img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Asegura que la imagen se ajuste al contenedor */
        }
    </style>
</head>

<body>
    <section class="layout">
        <div><img src="1.jpg" alt="Imagen 1"></div>
        <div><img src="2.jpg" alt="Imagen 2"></div>
        <div><img src="3.jpg" alt="Imagen 3"></div>
        <div><img src="4.jpg" alt="Imagen 4"></div>
        <div><img src="5.jpg" alt="Imagen 5"></div>
        <div><img src="6.jpg" alt="Imagen 6"></div>
        <div><img src="7.jpg" alt="Imagen 7"></div>
        <div><img src="8.jpg" alt="Imagen 8"></div>
        <div><img src="9.jpg" alt="Imagen 9"></div>
    </section>
</body>

</html>
